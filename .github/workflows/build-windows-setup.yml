name: Validate Windows App Sources

on:
  push:
    branches: [ main ]
    paths:
      - "windows-app/current/**"
      - "windows-app/launcher/**"
      - "windows-app/assets/**"
      - ".github/workflows/build-windows-setup.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "windows-app/current/Lumitool_Printsever_Setup_V4_1.ps1",
            "windows-app/current/Lumitool_Scan_Helper_V1.ps1",
            "windows-app/current/Lumitool_Job_Watcher_V2.ps1",
            "windows-app/current/Lumitool_OTA_Helper_V1.ps1",
            "windows-app/current/Lumitool_Preinstall_Cleanup_V1.ps1",
            "windows-app/current/Lumitool_Watcher_Install_V2.ps1",
            "windows-app/launcher/Lumitool_Printsever_Launcher.cs",
            "windows-app/launcher/Lumitool_Printsever_Launcher.manifest",
            "windows-app/assets/Lumi3D_logo.png"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required file: $path" }
          }

          Get-ChildItem "windows-app/current" -Filter "*.ps1" -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw "PowerShell syntax failed: $($_.Name)"
            }
            Write-Host "OK: $($_.Name)"
          }

      - name: Validate current architecture
        shell: powershell
        run: |
          $main = Get-Content "windows-app/current/Lumitool_Printsever_Setup_V4_1.ps1" -Raw
          $watcher = Get-Content "windows-app/current/Lumitool_Job_Watcher_V2.ps1" -Raw
          $cleanup = Get-Content "windows-app/current/Lumitool_Preinstall_Cleanup_V1.ps1" -Raw
          $launcher = Get-Content "windows-app/launcher/Lumitool_Printsever_Launcher.cs" -Raw

          $must = @(
            @("Spooling ON", $main),
            @("Wait-PrinterVisible", $main),
            @("Test-RawEndpoint", $main),
            @("/api/jobs", $watcher),
            @("Remove-PrintJob", $watcher),
            @("Remove-Printer", $cleanup),
            @("Remove-PrinterPort", $cleanup),
            @("CreateNoWindow = true", $launcher)
          )

          foreach ($x in $must) {
            if (-not $x[1].Contains($x[0])) { throw "Missing current feature: $($x[0])" }
          }
