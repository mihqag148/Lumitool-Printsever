name: Build Windows Installer EXE

on:
  push:
    branches: [ main ]
    paths:
      - "windows-app/current/**"
      - "windows-app/installer/**"
      - "windows-app/launcher/**"
      - "windows-app/assets/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "windows-app/current/Lumitool_Printsever_Setup_V4_7.ps1",
            "windows-app/current/Lumitool_Scan_Helper_V1.ps1",
            "windows-app/current/Lumitool_Job_Watcher_V2.ps1",
            "windows-app/current/Lumitool_OTA_Helper_V1.ps1",
            "windows-app/current/Lumitool_Preinstall_Cleanup_V1.ps1",
            "windows-app/current/Lumitool_Watcher_Install_V2.ps1",
            "windows-app/launcher/Lumitool_Printsever_Launcher.cs",
            "windows-app/launcher/Lumitool_Printsever_Launcher.manifest",
            "windows-app/assets/Lumi3D_logo.png",
            "windows-app/installer/Lumitool_Printsever_V4_7.iss"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

          $psFiles = Get-ChildItem "windows-app/current" -Filter "*.ps1" -File
          foreach ($file in $psFiles) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($file.Name):" -ForegroundColor Red
              $errors | ForEach-Object {
                Write-Host ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) -ForegroundColor Red
              }
              exit 1
            }

            Write-Host "OK: $($file.Name)"
          }

      - name: Static integration checks
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $main = Get-Content "windows-app/current/Lumitool_Printsever_Setup_V4_7.ps1" -Raw
          $ota = Get-Content "windows-app/current/Lumitool_OTA_Helper_V1.ps1" -Raw
          $watcher = Get-Content "windows-app/current/Lumitool_Job_Watcher_V2.ps1" -Raw
          $watcherInstaller = Get-Content "windows-app/current/Lumitool_Watcher_Install_V2.ps1" -Raw
          $cleanup = Get-Content "windows-app/current/Lumitool_Preinstall_Cleanup_V1.ps1" -Raw
          $launcher = Get-Content "windows-app/launcher/Lumitool_Printsever_Launcher.cs" -Raw
          $iss = Get-Content "windows-app/installer/Lumitool_Printsever_V4_7.iss" -Raw

          $checks = @(
            @{ Name = "PrintUI queue configuration"; Text = "printui.dll,PrintUIEntry"; Source = $main },
            @{ Name = "PrintUI settings mode"; Text = "/Xs"; Source = $main },
            @{ Name = "Direct mode cleared"; Text = '"-direct"'; Source = $main },
            @{ Name = "Queued mode cleared"; Text = '"-queued"'; Source = $main },
            @{ Name = "Existing queue updated in place"; Text = 'Set-Printer -Name $name -DriverName $driver -PortName $portName'; Source = $main },
            @{ Name = "Watcher paused during queue mutation"; Text = "Pause-LumitoolJobWatcher"; Source = $main },
            @{ Name = "Watcher resumed after queue mutation"; Text = "Resume-LumitoolJobWatcher"; Source = $main },
            @{ Name = "Printer name quoted for PrintUI"; Text = '$safeName'; Source = $main },
            @{ Name = "No native SetPrinter mutation"; Text = "SetFastSpoolMode"; Source = $main; MustBeAbsent = $true },
            @{ Name = "No V4.3 prncnfg queue path"; Text = "QUEUE/PRNCNFG"; Source = $main; MustBeAbsent = $true },
            @{ Name = "No bulk CIM printer mutation"; Text = "Set-CimInstance -InputObject $wmiPrinter"; Source = $main; MustBeAbsent = $true },
            @{ Name = "Queue visibility verification"; Text = "Wait-PrinterVisible"; Source = $main },
            @{ Name = "RAW endpoint verification"; Text = "Test-RawEndpoint"; Source = $main },
            @{ Name = "Main checks watcher task"; Text = "Test-LumitoolJobWatcher"; Source = $main },
            @{ Name = "Watcher reads ESP jobs API"; Text = "/api/jobs"; Source = $watcher },
            @{ Name = "Watcher clears completed Windows jobs"; Text = "Remove-PrintJob"; Source = $watcher },
            @{ Name = "Watcher auto discovery"; Text = "AUTO-DISCOVERY"; Source = $watcher },
            @{ Name = "Watcher fallback delete"; Text = "Win32_PrintJob.Delete"; Source = $watcher },
            @{ Name = "Watcher boot install"; Text = "Register-ScheduledTask"; Source = $watcherInstaller },
            @{ Name = "OTA dialog"; Text = "Start-LumitoolOta"; Source = $main },
            @{ Name = "OTA prepare"; Text = "/support/prepare"; Source = $ota },
            @{ Name = "OTA upload"; Text = "/update"; Source = $ota },
            @{ Name = "Clean install cleanup"; Text = "Lumitool_Preinstall_Cleanup_V1.ps1"; Source = $iss },
            @{ Name = "Cleanup removes old queues"; Text = "Remove-Printer"; Source = $cleanup },
            @{ Name = "Cleanup removes old ports"; Text = "Remove-PrinterPort"; Source = $cleanup },
            @{ Name = "Cleanup preserves manufacturer drivers"; Text = "Vendor printer drivers preserved"; Source = $cleanup },
            @{ Name = "Hidden WinExe launcher"; Text = "CreateNoWindow = true"; Source = $launcher },
            @{ Name = "Launcher self elevation"; Text = 'Verb = "runas"'; Source = $launcher },
            @{ Name = "Launcher admin detection"; Text = "IsAdministrator()"; Source = $launcher },
            @{ Name = "Manifest avoids CreateProcess 740"; Text = 'level="asInvoker"'; Source = (Get-Content "windows-app/launcher/Lumitool_Printsever_Launcher.manifest" -Raw) },
            @{ Name = "Installer uses EXE launcher"; Text = "Lumitool_Printsever.exe"; Source = $iss },
            @{ Name = "Installer uses Lumi3D icon"; Text = "SetupIconFile=..\build\Lumi3D_logo.ico"; Source = $iss },
            @{ Name = "No spooler restart"; Text = "Restart-Service -Name Spooler"; Source = $main; MustBeAbsent = $true }
          )

          foreach ($check in $checks) {
            if ($check.MustBeAbsent) {
              if ($check.Source.Contains($check.Text)) {
                throw "Static check failed: $($check.Name)"
              }
            } else {
              if (-not $check.Source.Contains($check.Text)) {
                throw "Static check failed: $($check.Name)"
              }
            }
            Write-Host "OK: $($check.Name)"
          }

      - name: Build Lumi3D icon
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "windows-app/build" -Force | Out-Null
          python -m pip install pillow --quiet
          @'
          from PIL import Image
          img = Image.open(r"windows-app/assets/Lumi3D_logo.png").convert("RGBA")
          img.save(
              r"windows-app/build/Lumi3D_logo.ico",
              format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )
          '@ | python -

          if (-not (Test-Path "windows-app/build/Lumi3D_logo.ico")) {
            throw "ICO generation failed"
          }

      - name: Build hidden Windows launcher
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw "csc.exe not found" }

          $args = @(
            "/nologo",
            "/target:winexe",
            "/optimize+",
            "/reference:System.Windows.Forms.dll",
            "/win32icon:windows-app\build\Lumi3D_logo.ico",
            "/win32manifest:windows-app\launcher\Lumitool_Printsever_Launcher.manifest",
            "/out:windows-app\build\Lumitool_Printsever.exe",
            "windows-app\launcher\Lumitool_Printsever_Launcher.cs"
          )

          & $csc @args
          if ($LASTEXITCODE -ne 0) { throw "Launcher compile failed" }
          if (-not (Test-Path "windows-app/build/Lumitool_Printsever.exe")) {
            throw "Launcher EXE missing"
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw "ISCC.exe not found after Inno Setup install"
          }

          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build single EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          & "$env:ISCC" "windows-app\installer\Lumitool_Printsever_V4_7.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $exe = "dist\Lumitool_Printsever_Setup_V4_7.exe"
          if (-not (Test-Path $exe)) {
            throw "Installer EXE was not created"
          }

          $item = Get-Item $exe
          Write-Host ("Installer: " + $item.FullName)
          Write-Host ("Size: " + $item.Length + " bytes")
          Write-Host ("Authenticode: " + (Get-AuthenticodeSignature $exe).Status)

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumitool-Printsever-Setup-V4.7-EXE
          path: dist/Lumitool_Printsever_Setup_V4_7.exe
          if-no-files-found: error
          retention-days: 30
